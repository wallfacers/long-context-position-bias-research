[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "long-context-position-bias-research"
version = "0.1.0"
description = "Research toolkit for position bias and effective context utilization in long-context language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = [
    "datasets==5.0.1",
    "huggingface-hub==1.23.0",
    "jinja2>=3.1",
    "transformers>=4.46",
]
test = [
    "huggingface-hub==1.23.0",
    "matplotlib==3.10.5",
    "pyparsing==3.2.5",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
